<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
</head>
<body>
<div id="loginBox">
<h2>Dang nhap Admin</h2>
<input id="u" value="admin" placeholder="Tai khoan">
<input id="p" type="password" value="admin123" placeholder="Mat khau">
<button onclick="login()">Dang nhap</button>
<p id="msg"></p>
</div>
<div id="panel" style="display:none">
<select id="duration">
<option value="1h">1 gio</option>
<option value="1d">1 ngay</option>
<option value="1w">1 tuan</option>
<option value="1m">1 thang</option>
<option value="1y">1 nam</option>
<option value="forever">Vinh vien</option>
</select>
<button onclick="createKey()">Tao Key</button>
<button onclick="copyAll()">Copy tat ca</button>
<button onclick="loadKeys()">Tai lai</button>
<table id="tbl"></table>
</div>
<script>
var token="";
function login(){
document.getElementById("msg").innerText="Dang ket noi...";
fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})})
.then(function(r){return r.json()})
.then(function(j){
if(j.token){
token=j.token;
document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";
loadKeys();
}else{
document.getElementById("msg").innerText="Sai: "+(j.error||"");
}
})
.catch(function(e){document.getElementById("msg").innerText="Loi: "+e.message});
}
function createKey(){
fetch("/api/create-key",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({duration:document.getElementById("duration").value})})
.then(function(r){return r.json()})
.then(function(j){if(j.key){alert("Key: "+j.key);loadKeys()}});
}
function loadKeys(){
fetch("/api/keys",{headers:{"Authorization":"Bearer "+token}})
.then(function(r){return r.json()})
.then(function(j){
var t=document.getElementById("tbl");
t.innerHTML="<tr><th>Key</th><th>Loai</th><th>UID</th><th>Xoa</th></tr>";
j.keys.forEach(function(k){
var tr=document.createElement("tr");
tr.innerHTML="<td>"+k.key+"</td><td>"+k.duration+"</td><td>"+(k.uid||"-")+"</td><td><button onclick=\"delKey('"+k.key+"')\">Xoa</button></td>";
t.appendChild(tr);
});
});
}
function delKey(k){
if(!confirm("Xoa?"))return;
fetch("/api/delete-key/"+k,{method:"DELETE",headers:{"Authorization":"Bearer "+token}}).then(function(){loadKeys()});
}
function copyAll(){
fetch("/api/keys",{headers:{"Authorization":"Bearer "+token}})
.then(function(r){return r.json()})
.then(function(j){
navigator.clipboard.writeText(j.keys.map(function(k){return k.key}).join("\n"));
alert("Da copy "+j.keys.length+" key");
});
}
</script>
</body>
</html>
